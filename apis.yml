name: Play Versus
description: >-
  Play Versus (PlayVS) is North America's leading scholastic and collegiate
  esports platform, operating competitive gaming leagues for middle schools,
  high schools, and colleges alongside an esports curriculum and college
  recruitment services. The platform partners with major publishers including
  Riot Games, EA, Blizzard, and Psyonix, and runs its competitions and rosters
  through the app.playvs.com web application. PlayVS is a consumer/education
  product and does not publish a public developer API, developer portal, or API
  documentation surface; this profile captures its published identity, support,
  and policy properties. It was surfaced as a portfolio company of Battery
  Ventures and added to the API Evangelist network.
